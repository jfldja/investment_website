name: Update TW quotes

on:
  schedule:
    # UTC 06:30 = 台北 14:30（13:30 收盤後），週一到週五
    - cron: '30 6 * * 1-5'
  workflow_dispatch: {}   # 允許在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-tw-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TWSE data
        run: node scripts/fetch-tw-quotes.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tw-quotes.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update TW quotes"
            git push
          fi
