name: Update TW quotes

on:
  schedule:
    # UTC 06:30 = 台北 14:30（13:30 收盤後），週一到週五
    - cron: '30 6 * * 1-5'
  workflow_dispatch: {}   # 允許在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-tw-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch TWSE data
        run: node scripts/fetch-tw-quotes.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tw-quotes.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update TW quotes"
          # 執行期間遠端可能有新 commit：先 rebase 再 push，最多重試 3 次；
          # 若 tw-quotes.json 發生衝突，以這次新抓的資料為準（rebase 時 theirs = 正在重放的機器人 commit）
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "push 失敗，第 $i 次重試..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::連續 3 次 push 失敗"
          exit 1